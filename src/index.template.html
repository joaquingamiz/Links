<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0c0f">
  <meta name="description" content="JG Links: Joaquín Gamiz’s website, projects and social profiles across cybersecurity, cloud and AI.">
  <link rel="canonical" href="https://joaquingamiz.github.io/Links/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="en_US">
  <meta property="og:title" content="JG Links · Cybersecurity, Cloud & AI">
  <meta property="og:description" content="Projects and places to find Joaquín Gamiz across cybersecurity, cloud and AI.">
  <meta property="og:url" content="https://joaquingamiz.github.io/Links/">
  <meta property="og:image" content="https://joaquingamiz.github.io/Links/assets/images/og-jg.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <title>JG Links · Cybersecurity, Cloud & AI</title>
  <link rel="icon" href="assets/images/jg-logo.png" type="image/png">
  <link rel="stylesheet" href="assets/css/main.css">
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfilePage",
      "url": "https://joaquingamiz.github.io/Links/",
      "mainEntity": {
        "@type": "Person",
        "name": "Joaquín Gamiz",
        "alternateName": "JG",
        "jobTitle": "Cybersecurity Architect",
        "url": "https://joaquingamiz.com/",
        "sameAs": [
          "https://www.linkedin.com/in/joaquin-gamiz/",
          "https://github.com/joaquingamiz",
          "https://www.youtube.com/@joaquin_gamiz",
          "https://www.instagram.com/joaquin_gamiz/"
        ]
      }
    }
  </script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="shell">
    <header class="site-header">
      <a class="brand" href="./" aria-current="page"><img src="assets/images/jg-logo.png" alt="" width="40" height="40"><span>JG Links</span></a>
      <span class="header-note">One place. All things JG.</span>
    </header>
    <main id="main-content">
      <section class="profile" aria-labelledby="profile-title">
        <img class="portrait" src="assets/images/joaquin-linkedin.jpeg" alt="Joaquín Gamiz speaking on a podcast" width="800" height="800" fetchpriority="high">
        <div><p class="eyebrow">Joaquín Gamiz</p><h1 id="profile-title">I’m JG.</h1>
        <p class="roles">Cybersecurity Architect · Cloud Security · AI · MVP</p></div>
      </section>
      {{PRIMARY_LINK}}
      <section class="projects" aria-labelledby="projects-title">
        <div class="section-heading"><h2 id="projects-title">Projects</h2><span>Made by JG</span></div>
        <div class="project-grid">{{PROJECT_LINKS}}</div>
      </section>
      <nav class="social-row" aria-label="Find me online">{{SOCIAL_LINKS}}</nav>
    </main>
    <footer class="site-footer"><p>© {{YEAR}} Joaquín Gamiz</p><nav aria-label="Legal links"><a href="https://joaquingamiz.com/politica-privacidad" target="_blank" rel="noopener noreferrer">Privacy</a><a href="https://joaquingamiz.com/aviso-legal" target="_blank" rel="noopener noreferrer">Legal</a></nav></footer>
  </div>
</body>
</html>
